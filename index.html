<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indovina la Bandiera</title>
  <!-- Inclusione della libreria Flag Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons/css/flag-icons.min.css">
  <style>
    /* Stili base per una visualizzazione ottimale anche su dispositivi mobili */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      background: #f9f9f9;
    }
    #game {
      max-width: 600px;
      margin: auto;
      background: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
    }
    #question {
      font-size: 1.2em;
      margin-bottom: 15px;
      text-align: center;
    }
    #flag-display {
      text-align: center;
      margin-bottom: 15px;
    }
    .options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .option {
      flex: 1 1 calc(50% - 20px);
      padding: 10px;
      margin: 5px;
      text-align: center;
      border: 2px solid #007BFF;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
      user-select: none;
    }
    .option:hover {
      background: #007BFF;
      color: white;
    }
    .flag-icon {
      font-size: 3em;
    }
    #feedback {
      text-align: center;
      font-size: 1.1em;
      margin-top: 10px;
      height: 1.5em;
    }
    /* Stili per evidenziare le risposte */
    .correct {
      border-color: green;
      background-color: #c8facc;
      color: black;
    }
    .wrong {
      border-color: red;
      background-color: #fcdcdc;
      color: black;
    }
    .disabled {
      pointer-events: none;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div id="game">
    <h1>Indovina la Bandiera</h1>
    <div id="question"></div>
    <div id="flag-display"></div>
    <div class="options" id="options-container"></div>
    <div id="feedback"></div>
  </div>
  
  <script>
    // Array dei paesi con nome e codice (i codici sono quelli utilizzati dalla libreria Flag Icons)
    const countries = [
      {name: "Andorra", code: "ad"},
      {name: "Albania", code: "al"},
      {name: "Austria", code: "at"},
      {name: "Bielorussia", code: "by"},
      {name: "Belgio", code: "be"},
      {name: "Bosnia ed Erzegovina", code: "ba"},
      {name: "Bulgaria", code: "bg"},
      {name: "Croazia", code: "hr"},
      {name: "Cipro", code: "cy"},
      {name: "Repubblica Ceca", code: "cz"},
      {name: "Danimarca", code: "dk"},
      {name: "Estonia", code: "ee"},
      {name: "Finlandia", code: "fi"},
      {name: "Francia", code: "fr"},
      {name: "Germania", code: "de"},
      {name: "Grecia", code: "gr"},
      {name: "Ungheria", code: "hu"},
      {name: "Islanda", code: "is"},
      {name: "Irlanda", code: "ie"},
      {name: "Italia", code: "it"},
      {name: "Lettonia", code: "lv"},
      {name: "Lituania", code: "lt"},
      {name: "Lussemburgo", code: "lu"},
      {name: "Malta", code: "mt"},
      {name: "Moldavia", code: "md"},
      {name: "Monaco", code: "mc"},
      {name: "Montenegro", code: "me"},
      {name: "Paesi Bassi", code: "nl"},
      {name: "Macedonia del Nord", code: "mk"},
      {name: "Norvegia", code: "no"},
      {name: "Polonia", code: "pl"},
      {name: "Portogallo", code: "pt"},
      {name: "Romania", code: "ro"},
      {name: "Russia", code: "ru"},
      {name: "San Marino", code: "sm"},
      {name: "Serbia", code: "rs"},
      {name: "Slovacchia", code: "sk"},
      {name: "Slovenia", code: "si"},
      {name: "Spagna", code: "es"},
      {name: "Svezia", code: "se"},
      {name: "Svizzera", code: "ch"},
      {name: "Turchia", code: "tr"},
      {name: "Ucraina", code: "ua"},
      {name: "Regno Unito", code: "gb"},
      {name: "Città del Vaticano", code: "va"}
    ];
    
    let currentCorrect = null;
    let currentMode = null; // "name-to-flag" oppure "flag-to-name"

    // Funzione per mescolare un array (algoritmo di Fisher-Yates)
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // Genera 4 opzioni (inclusa quella corretta)
    function generateOptions(correctCountry) {
      const options = [correctCountry];
      while (options.length < 4) {
        const randomCountry = countries[Math.floor(Math.random() * countries.length)];
        if (!options.some(opt => opt.name === randomCountry.name)) {
          options.push(randomCountry);
        }
      }
      return shuffleArray(options);
    }

    // Mostra un messaggio di feedback e, dopo 1.5 secondi, genera una nuova domanda
    function showFeedback(message, isCorrect) {
      const feedbackDiv = document.getElementById("feedback");
      feedbackDiv.textContent = message;
      feedbackDiv.style.color = isCorrect ? "green" : "red";
      setTimeout(() => {
        feedbackDiv.textContent = "";
        generateQuestion();
      }, 1500);
    }

    // Impedisci l'interazione con le opzioni già scelte
    function disableOptions() {
      const optionElements = document.querySelectorAll(".option");
      optionElements.forEach(option => {
        option.classList.add("disabled");
      });
    }

    // Evidenzia l'opzione corretta, aggiungendogli la classe "correct"
    function highlightCorrectOption() {
      const optionElements = document.querySelectorAll(".option");
      optionElements.forEach(option => {
        if (option.dataset.country === currentCorrect.name) {
          option.classList.add("correct");
        }
      });
    }

    // Genera una nuova domanda
    function generateQuestion() {
      document.getElementById("options-container").innerHTML = "";
      document.getElementById("flag-display").innerHTML = "";
      
      // Scegliamo casualmente la modalità di gioco
      currentMode = Math.random() < 0.5 ? "name-to-flag" : "flag-to-name";
      currentCorrect = countries[Math.floor(Math.random() * countries.length)];
      const options = generateOptions(currentCorrect);
      
      const questionDiv = document.getElementById("question");
      
      if (currentMode === "name-to-flag") {
        // Modalità: dato il nome, seleziona la bandiera corretta
        questionDiv.textContent = "Seleziona la bandiera di: " + currentCorrect.name;
        options.forEach(option => {
          const btn = document.createElement("div");
          btn.className = "option";
          btn.dataset.country = option.name;
          btn.innerHTML = '<span class="fi fi-' + option.code + ' flag-icon"></span>';
          btn.addEventListener("click", function() {
            disableOptions();
            if (option.name === currentCorrect.name) {
              btn.classList.add("correct");
              showFeedback("Giusto!", true);
            } else {
              btn.classList.add("wrong");
              // Evidenzia l'opzione corretta
              highlightCorrectOption();
              showFeedback("Sbagliato!", false);
            }
          });
          document.getElementById("options-container").appendChild(btn);
        });
      } else {
        // Modalità: data la bandiera, seleziona il nome corretto
        questionDiv.textContent = "Seleziona il nome corrispondente a questa bandiera:";
        document.getElementById("flag-display").innerHTML = 
          '<span class="fi fi-' + currentCorrect.code + ' flag-icon"></span>';
        options.forEach(option => {
          const btn = document.createElement("div");
          btn.className = "option";
          btn.dataset.country = option.name;
          btn.textContent = option.name;
          btn.addEventListener("click", function() {
            disableOptions();
            if (option.name === currentCorrect.name) {
              btn.classList.add("correct");
              showFeedback("Giusto!", true);
            } else {
              btn.classList.add("wrong");
              highlightCorrectOption();
              showFeedback("Sbagliato!", false);
            }
          });
          document.getElementById("options-container").appendChild(btn);
        });
      }
    }

    // Inizializza il gioco al caricamento della pagina
    window.onload = generateQuestion;
  </script>
</body>
</html>
