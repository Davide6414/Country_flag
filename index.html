<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indovina la Bandiera</title>
  <!-- Inclusione della libreria Flag Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons/css/flag-icons.min.css">
  <style>
    /* Stili di base per mobile e desktop */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      background: #f9f9f9;
    }
    #game {
      max-width: 600px;
      margin: auto;
      background: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
    }
    #streak {
      text-align: center;
      font-weight: bold;
      margin-top: 10px;
    }
    #question {
      font-size: 1.2em;
      margin-bottom: 15px;
      text-align: center;
    }
    #flag-display {
      text-align: center;
      margin-bottom: 15px;
    }
    /* Contenitore per il campo di testo della terza modalità */
    #input-container {
      text-align: center;
      margin-top: 10px;
    }
    /* Stili per il campo di testo e il pulsante */
    #answer-input {
      font-size: 1em;
      padding: 5px;
      width: 70%;
      border: 2px solid #007BFF;
      border-radius: 4px;
    }
    #submit-button {
      font-size: 1em;
      padding: 5px 10px;
      margin-left: 5px;
      border: 2px solid #007BFF;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      transition: background 0.3s;
    }
    #submit-button:hover {
      background: #007BFF;
      color: #fff;
    }
    /* Container per le opzioni a scelta multipla */
    .options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .option {
      flex: 1 1 calc(50% - 20px);
      padding: 10px;
      margin: 5px;
      text-align: center;
      border: 2px solid #007BFF;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
      user-select: none;
    }
    .option:hover {
      background: #007BFF;
      color: white;
    }
    .flag-icon {
      font-size: 3em;
    }
    #feedback {
      text-align: center;
      font-size: 1.1em;
      margin-top: 10px;
      height: 1.5em;
    }
    /* Evidenziazione delle risposte */
    .correct {
      border-color: green;
      background-color: #c8facc;
      color: black;
    }
    .wrong {
      border-color: red;
      background-color: #fcdcdc;
      color: black;
    }
    .disabled {
      pointer-events: none;
      opacity: 0.6;
    }
    /* Cronologia errori */
    #error-history {
      margin-top: 20px;
    }
    #error-history summary {
      font-weight: bold;
      cursor: pointer;
    }
    #error-log {
      padding: 10px;
    }
    .error-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 5px;
    }
    .error-item .flag-icon {
      font-size: 1.5em;
    }
  </style>
</head>
<body>
  <div id="game">
    <h1>Indovina la Bandiera</h1>
    <div id="streak">Streak: <span id="streak-value">0</span></div>
    <div id="question"></div>
    <div id="flag-display"></div>
    <div id="input-container"></div>
    <div class="options" id="options-container"></div>
    <div id="feedback"></div>
    
    <details id="error-history">
      <summary>Cronologia Errori</summary>
      <div id="error-log"></div>
    </details>
  </div>
  
  <script>
    // Array dei paesi: nome e codice per Flag Icons (codici in minuscolo)
    const countries = [
      {name: "Andorra", code: "ad"},
      {name: "Albania", code: "al"},
      {name: "Austria", code: "at"},
      {name: "Bielorussia", code: "by"},
      {name: "Belgio", code: "be"},
      {name: "Bosnia ed Erzegovina", code: "ba"},
      {name: "Bulgaria", code: "bg"},
      {name: "Croazia", code: "hr"},
      {name: "Cipro", code: "cy"},
      {name: "Repubblica Ceca", code: "cz"},
      {name: "Danimarca", code: "dk"},
      {name: "Estonia", code: "ee"},
      {name: "Finlandia", code: "fi"},
      {name: "Francia", code: "fr"},
      {name: "Germania", code: "de"},
      {name: "Grecia", code: "gr"},
      {name: "Ungheria", code: "hu"},
      {name: "Islanda", code: "is"},
      {name: "Irlanda", code: "ie"},
      {name: "Italia", code: "it"},
      {name: "Lettonia", code: "lv"},
      {name: "Lituania", code: "lt"},
      {name: "Lussemburgo", code: "lu"},
      {name: "Malta", code: "mt"},
      {name: "Moldavia", code: "md"},
      {name: "Monaco", code: "mc"},
      {name: "Montenegro", code: "me"},
      {name: "Paesi Bassi", code: "nl"},
      {name: "Macedonia del Nord", code: "mk"},
      {name: "Norvegia", code: "no"},
      {name: "Polonia", code: "pl"},
      {name: "Portogallo", code: "pt"},
      {name: "Romania", code: "ro"},
      {name: "Russia", code: "ru"},
      {name: "San Marino", code: "sm"},
      {name: "Serbia", code: "rs"},
      {name: "Slovacchia", code: "sk"},
      {name: "Slovenia", code: "si"},
      {name: "Spagna", code: "es"},
      {name: "Svezia", code: "se"},
      {name: "Svizzera", code: "ch"},
      {name: "Turchia", code: "tr"},
      {name: "Ucraina", code: "ua"},
      {name: "Regno Unito", code: "gb"},
      {name: "Città del Vaticano", code: "va"}
    ];
    
    let currentCorrect = null;
    let currentMode = null;  // Può essere: "name-to-flag", "flag-to-name", "flag-to-input"
    let streak = 0;          // Conta le risposte corrette di fila
    let errorHistory = [];   // Cronologia errori (max 5)
    
    // Funzione per mescolare un array (algoritmo Fisher-Yates)
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }
    
    // Genera 4 opzioni (inclusa quella corretta)
    function generateOptions(correctCountry) {
      const options = [correctCountry];
      while(options.length < 4) {
        const randomCountry = countries[Math.floor(Math.random() * countries.length)];
        if(!options.some(opt => opt.name === randomCountry.name)) {
          options.push(randomCountry);
        }
      }
      return shuffleArray(options);
    }
    
    // Aggiorna il valore della streak
    function updateStreak() {
      document.getElementById("streak-value").textContent = streak;
    }
    
    // Aggiorna la sezione della cronologia errori (mostra i 5 errori più recenti)
    function updateErrorLog() {
      const errorLogDiv = document.getElementById("error-log");
      errorLogDiv.innerHTML = "";
      errorHistory.slice().reverse().forEach(error => {
        const div = document.createElement("div");
        div.className = "error-item";
        div.innerHTML = '<span class="fi fi-' + error.code + ' flag-icon"></span><span>' + error.name + '</span>';
        errorLogDiv.appendChild(div);
      });
    }
    
    // Mostra un messaggio di feedback per 1.5 secondi e poi genera una nuova domanda
    function showFeedback(message, isCorrect) {
      const feedbackDiv = document.getElementById("feedback");
      feedbackDiv.textContent = message;
      feedbackDiv.style.color = isCorrect ? "green" : "red";
      setTimeout(() => {
        feedbackDiv.textContent = "";
        generateQuestion();
      }, 1500);
    }
    
    // Disabilita le opzioni cliccabili (modalità a scelta multipla)
    function disableOptions() {
      const optionElements = document.querySelectorAll(".option");
      optionElements.forEach(option => {
        option.classList.add("disabled");
      });
    }
    
    // Evidenzia, nelle modalità a scelta multipla, l'opzione corretta
    function highlightCorrectOption() {
      const optionElements = document.querySelectorAll(".option");
      optionElements.forEach(option => {
        if(option.dataset.country === currentCorrect.name) {
          option.classList.add("correct");
        }
      });
    }
    
    // Genera una nuova domanda scegliendo casualmente una delle 3 modalità
    function generateQuestion() {
      // Pulizia delle sezioni prima di una nuova domanda
      document.getElementById("options-container").innerHTML = "";
      document.getElementById("flag-display").innerHTML = "";
      document.getElementById("input-container").innerHTML = "";
      
      // Selezione casuale della modalità: circa 33% per ciascuna
      let modeRandom = Math.random();
      if(modeRandom < 1/3) {
        currentMode = "name-to-flag";
      } else if(modeRandom < 2/3) {
        currentMode = "flag-to-name";
      } else {
        currentMode = "flag-to-input";
      }
      
      currentCorrect = countries[Math.floor(Math.random() * countries.length)];
      const options = generateOptions(currentCorrect);
      const questionDiv = document.getElementById("question");
      
      if(currentMode === "name-to-flag") {
        questionDiv.textContent = "Seleziona la bandiera di: " + currentCorrect.name;
        options.forEach(option => {
          const btn = document.createElement("div");
          btn.className = "option";
          btn.dataset.country = option.name;
          btn.innerHTML = '<span class="fi fi-' + option.code + ' flag-icon"></span>';
          btn.addEventListener("click", function() {
            disableOptions();
            if(option.name === currentCorrect.name) {
              btn.classList.add("correct");
              streak++;
              updateStreak();
              showFeedback("Giusto!", true);
            } else {
              btn.classList.add("wrong");
              streak = 0;
              updateStreak();
              highlightCorrectOption();
              errorHistory.push(currentCorrect);
              if(errorHistory.length > 5) errorHistory.shift();
              updateErrorLog();
              showFeedback("Sbagliato!", false);
            }
          });
          document.getElementById("options-container").appendChild(btn);
        });
      } else if(currentMode === "flag-to-name") {
        questionDiv.textContent = "Seleziona il nome corrispondente a questa bandiera:";
        document.getElementById("flag-display").innerHTML = '<span class="fi fi-' + currentCorrect.code + ' flag-icon"></span>';
        options.forEach(option => {
          const btn = document.createElement("div");
          btn.className = "option";
          btn.dataset.country = option.name;
          btn.textContent = option.name;
          btn.addEventListener("click", function() {
            disableOptions();
            if(option.name === currentCorrect.name) {
              btn.classList.add("correct");
              streak++;
              updateStreak();
              showFeedback("Giusto!", true);
            } else {
              btn.classList.add("wrong");
              streak = 0;
              updateStreak();
              highlightCorrectOption();
              errorHistory.push(currentCorrect);
              if(errorHistory.length > 5) errorHistory.shift();
              updateErrorLog();
              showFeedback("Sbagliato!", false);
            }
          });
          document.getElementById("options-container").appendChild(btn);
        });
      } else if(currentMode === "flag-to-input") {
        questionDiv.textContent = "Inserisci il nome dello stato corrispondente a questa bandiera:";
        document.getElementById("flag-display").innerHTML = '<span class="fi fi-' + currentCorrect.code + ' flag-icon"></span>';
        // Creazione dinamica del campo di testo e del pulsante
        const inputContainer = document.getElementById("input-container");
        const input = document.createElement("input");
        input.type = "text";
        input.id = "answer-input";
        input.setAttribute("list", "countries-list");
        input.placeholder = "Scrivi il nome dello stato...";
        
        const submitBtn = document.createElement("button");
        submitBtn.id = "submit-button";
        submitBtn.textContent = "Verifica";
        // Funzione per verificare la risposta inserita
        function checkInputAnswer() {
          input.disabled = true;
          submitBtn.disabled = true;
          const userAnswer = input.value.trim().toLowerCase();
          const correctAnswer = currentCorrect.name.toLowerCase();
          if(userAnswer === correctAnswer) {
            input.style.borderColor = "green";
            streak++;
            updateStreak();
            showFeedback("Giusto!", true);
          } else {
            input.style.borderColor = "red";
            streak = 0;
            updateStreak();
            errorHistory.push(currentCorrect);
            if(errorHistory.length > 5) errorHistory.shift();
            updateErrorLog();
            showFeedback("Sbagliato! La risposta corretta era " + currentCorrect.name, false);
          }
        }
        // Invio con il tasto Invio
        input.addEventListener("keydown", function(event) {
          if(event.key === "Enter") {
            checkInputAnswer();
          }
        });
        // Invio con il click sul pulsante
        submitBtn.addEventListener("click", checkInputAnswer);
        inputContainer.appendChild(input);
        inputContainer.appendChild(submitBtn);
        input.focus();
      }
    }
    
    // Genera un <datalist> con l'elenco dei paesi per il campo di testo della modalità "flag-to-input"
    function generateDatalist() {
      const datalist = document.createElement("datalist");
      datalist.id = "countries-list";
      countries.forEach(country => {
        const option = document.createElement("option");
        option.value = country.name;
        datalist.appendChild(option);
      });
      document.body.appendChild(datalist);
    }
    
    // Inizializza la datalist e avvia il gioco
    generateDatalist();
    window.onload = generateQuestion;
  </script>
</body>
</html>
